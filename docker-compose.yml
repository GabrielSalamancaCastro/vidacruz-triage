version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: vidacruz-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vidacruz}
      POSTGRES_USER: ${POSTGRES_USER:-vidacruz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vidacruz}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vidacruz} -d ${POSTGRES_DB:-vidacruz}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: soldevelo/kafka:3.7
    container_name: vidacruz-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafkadata:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vidacruz-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  triage-service:
    build:
      context: ./triage-service
      dockerfile: Dockerfile
    container_name: vidacruz-triage
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      API_KEY_HEADER: ${API_KEY_HEADER:-vidacruz-dev-api-key}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    ports:
      - "8081:8081"

  asistente-service:
    build:
      context: ./asistente-service
      dockerfile: Dockerfile
    container_name: vidacruz-asistente
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      API_KEY_HEADER: ${API_KEY_HEADER:-vidacruz-dev-api-key}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com}
    ports:
      - "8082:8082"

volumes:
  pgdata:
  kafkadata: