server:
  port: 8081

spring:
  application:
    name: triage-service
  r2dbc:
    url: r2dbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:vidacruz}
    username: ${POSTGRES_USER:vidacruz}
    password: ${POSTGRES_PASSWORD:vidacruz}
    pool:
      initial-size: 5
      max-size: 20
  flyway:
    enabled: true
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:vidacruz}
    user: ${POSTGRES_USER:vidacruz}
    password: ${POSTGRES_PASSWORD:vidacruz}
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        spring.json.add.type.headers: false #No queremos un Header que nos indique la clase de Java

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

triage:
  sla:
    check-interval-ms: ${TRIAGE_SLA_CHECK_INTERVAL_MS:30000}
    check-interval-seconds: ${TRIAGE_SLA_CHECK_INTERVAL_SECONDS:30}
    override-seconds: ${TRIAGE_SLA_OVERRIDE_SECONDS:}
  security:
    api-key: ${API_KEY_HEADER:vidacruz-dev-api-key}
  alerts:
    slack-webhook-url: ${SLACK_WEBHOOK_URL:}
    discord-webhook-url: ${DISCORD_WEBHOOK_URL:}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId:-},%X{pacienteId:-}] %logger{36} - %msg%n"